connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://timescaledb:5432/iceberg
iceberg.jdbc-catalog.connection-user=odor
iceberg.jdbc-catalog.connection-password=odortwin
iceberg.jdbc-catalog.default-warehouse-dir=s3://lake/warehouse
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=odortwin
s3.aws-secret-key=odortwin-secret
# 5분마다 새로 만드는 표의 스냅샷을 1일만 남길 수 있게 (기본 최소 7일)
iceberg.expire-snapshots.min-retention=1h
iceberg.remove-orphan-files.min-retention=1h
